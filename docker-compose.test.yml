services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: querypilot
      POSTGRES_DB: querypilot_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot_test"]
      interval: 3s
      timeout: 3s
      retries: 10
