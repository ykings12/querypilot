[project]
name = "querypilot"
version = "0.1.0"
description = "Secure natural-language-to-SQL developer tool with agent tracing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "streamlit>=1.40.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "sqlglot>=26.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.9.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: live API + LLM smoke tests (set RUN_SMOKE_CHAT=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
