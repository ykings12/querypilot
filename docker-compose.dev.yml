# Fast local dev overrides — no rebuild needed for code edits.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# UI: edit files under ui/ → Streamlit auto-reloads in ~1s
# API: edit files under app/ → uvicorn --reload restarts in ~1s

services:
  api:
    volumes:
      - ./app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--reload",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  ui:
    volumes:
      - ./ui:/app/ui
