services:
  metadata-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: querypilot
      POSTGRES_DB: querypilot_meta
    ports:
      - "5435:5432"
    volumes:
      - metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d querypilot_meta"]
      interval: 5s
      timeout: 5s
      retries: 5

  target-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: querypilot
      POSTGRES_PASSWORD: querypilot
      POSTGRES_DB: chinook
    ports:
      - "5433:5432"
    volumes:
      - target_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querypilot -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      METADATA_DATABASE_URL: postgresql+asyncpg://querypilot:querypilot@metadata-db:5432/querypilot_meta
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:8501
      DOCS_DIR: /app/data/docs
      QUERYPILOT_HASH_EMBEDDINGS: "1"
    volumes:
      - ./data/docs:/app/data/docs:ro
    depends_on:
      metadata-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  metadata_data:
  target_data:
